<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penghitung Klik</title>
</head>
<body>
    <h1>Penghitung Jumlah Klik</h1>
    <button id="btnKlik">Klik Saya</button>
    <p>Jumlah klik: <span id="jumlahKlik">0</span></p>
    <script>
        let jumlah = 0;
        const tombol = document.getElementById("btnKlik");
        const hasil = document.getElementById("jumlahKlik");
        tombol.addEventListener("click", function() {
            jumlah++;
            hasil.textContent = jumlah;
        });
    </script>
</body>
</html>
